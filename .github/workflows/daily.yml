name: 每日增量

on:
  schedule:
    - cron: '45 9 * * 1-5'   # 北京时间 周一~五 17:45（baostock日线17:30入库后）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write             # 允许 bot 推送数据提交

concurrency:
  group: ashare-data-pipeline # ★ 三个workflow共用同一group：任何两个都不会同时跑
  cancel-in-progress: false   # 撞车时排队，不互相打断

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # 预算50min+兜底+扫描+写盘，留足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖（版本锁定）
        run: pip install -r requirements.txt

      - name: 拉取每日增量
        env:
          PYTHONUNBUFFERED: '1'   # 日志实时显示
        run: python src/daily_append.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有数据变更（假期或全部已最新）"
          else
            git commit -m "📈 每日增量 $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase
            git push
          fi
