# =====================================================================
# A股每日数据拉取工作流
# 触发方式：
#   1. 每天 北京时间20:30（UTC 12:30）主力运行：快照+龙虎榜+北向+增量追加
#   2. 每天 北京时间23:00（UTC 15:00）兜底重跑：已完成的全跳过，重跑无害
#   3. 手动触发：请在交易日15:30之后点击（时间闸门会拦截盘前/盘中触发）
# 与历史初始化工作流共用互斥锁，任务之间永不撞车
# =====================================================================
name: A股定时拉取数据

on:
  workflow_dispatch: {}   # 允许手动触发

  schedule:
    # 北京时间20:30 主力（UTC 12:30）
    - cron: '30 12 * * 1-5'
    # 北京时间23:00 兜底（UTC 15:00）
    - cron: '0 15 * * 1-5'

# 互斥锁：数据相关任务同一时间只允许一个实例运行（与历史初始化共用）
concurrency:
  group: ashare-data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 快照几分钟 + 增量追加约40分钟，2小时上限富余

    steps:
      # 1. 拉取仓库代码
      - name: 检出仓库
        uses: actions/checkout@v4

      # 2. 配置Python环境
      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 安装依赖（版本锁定在 requirements.txt，保证行为可预测）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 运行每日快照脚本（快照+龙虎榜+北向+断档检查，内置时间闸门）
      - name: 运行每日快照
        run: python src/fetch_ashare_data.py

      # 5. 运行每日增量追加脚本（自愈式补齐历史库，内置时间闸门+初始化检测）
      - name: 运行增量追加
        run: python src/daily_append.py

      # 6. 提交数据回仓库
      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "本次没有新数据产生，跳过提交"
          else
            git commit -m "数据更新：每日快照+增量追加 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
