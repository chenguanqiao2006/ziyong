name: A股定时拉取数据

# UTC时间：0 9 * * 1-5 → 北京时间 17:00 周一至周五
on:
  schedule:
    - cron: '0 9 * * 1-5'
  # 支持手动点击运行测试
  workflow_dispatch:

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖 akshare pandas
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 运行A股数据拉取脚本
        run: python fetch_ashare_data.py

      - name: 提交更新的数据文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./data/*.csv
          git commit -m "🤖 自动更新A股行情数据 $(date +'%Y-%m-%d')" || echo "无新数据，无需提交"
          git push
